[project]
name = "avanserv-zensical-theme"
version = "0.1.0"
description = "The avanserv theme for Zensical documentation sites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "src/avanserv_zensical_theme/assets/avanserv/brand/fonts/OFL*.txt"]
requires-python = ">=3.11"
dependencies = ["zensical>=0.0.68"]

[project.entry-points."mkdocs.themes"]
avanserv = "avanserv_zensical_theme"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avanserv_zensical_theme"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
