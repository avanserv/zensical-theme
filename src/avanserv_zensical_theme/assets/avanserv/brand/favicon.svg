<?xml version="1.0" encoding="UTF-8"?>
<!--
  avanserv favicon, a self-contained dark tile so it reads on any browser-tab colour. A faint
  hairline appears only in dark UIs so the tile edge stays visible against near-black chrome.
  Tile = color-page (#050e1a), mark = ink-200 (#dee7f5), hairline = the color-hairline channels
  (ink-400) at an alpha tuned for a 16px tile. The mark takes more of the tile than in the app
  icons, because at 16px every pixel of width is legibility. The region below is written by
  build/geometry.ts.
-->
<!-- geometry:begin -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="avanserv">
  <defs>
    <style>
      .edge { stroke: transparent; }
      @media (prefers-color-scheme: dark) { .edge { stroke: rgba(159,175,198,0.24); } }
    </style>
  </defs>
  <rect x="1" y="1" width="510" height="510" rx="116" fill="#050e1a"/>
  <rect class="edge" x="2.5" y="2.5" width="507" height="507" rx="114.5" fill="none" stroke-width="3"/>
  <svg x="63.02" y="138.73" width="385.96" height="234.53" viewBox="-38.47 -520.82 857.1 520.82">
    <path fill="#dee7f5" d="M483 -241.5A241.5 241.5 0 0 0 0 -241.5A241.5 241.5 0 0 0 483 -241.5ZM352 -241.5A110.5 110.5 0 0 1 131 -241.5A110.5 110.5 0 0 1 352 -241.5ZM352 0L483 0L483 -445.18L352 -520.82ZM546 0L818.63 -157.41L818.63 -251.41L546 -408.81L546 -277.81L673.14 -204.41L546 -131Z"/>
  </svg>
</svg>
<!-- geometry:end -->
